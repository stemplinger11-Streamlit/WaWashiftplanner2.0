# Streamlits eigenes Theme.
#
# Muss zum Standardmodus der App passen. Streamlit faerbt damit Elemente,
# die unser CSS nicht sicher erreicht (Aufklapp-Menues, Datumsauswahl).
# Steht hier "light", waehrend die App dunkel malt, entsteht genau der
# Bruch aus dem Fehlerbild: helle Seite, dunkles Formular, unsichtbare
# Ueberschrift.
#
# Werte aus core_theme.DARK, abgeglichen durch test_core_theme.py.

[theme]
base = "dark"
primaryColor = "#6FB6F0"
backgroundColor = "#161B2C"
secondaryBackgroundColor = "#212739"
textColor = "#F4F7FB"

# Hinweis: showErrorDetails wird bewusst NICHT auf false gesetzt, damit
# waehrend der Testphase noch echte Fehlermeldungen sichtbar sind.
# Vor dem Saisonstart erwaegen (siehe TODO).

[browser]
gatherUsageStats = false
