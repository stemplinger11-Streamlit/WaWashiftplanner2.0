name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        # Nur was die Tests brauchen - sie kommen ohne Streamlit
        # und ohne Firestore aus.
        run: pip install pytest pytz bcrypt pyflakes

      - name: Tests
        run: python -m pytest -q

      - name: Statische Prüfung auf undefinierte Namen
        run: python -m pyflakes streamlit_app.py core_*.py scripts/*.py
