name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Gleiche Version wie Streamlit Community Cloud. Weicht sie ab,
          # faellt ein fehlendes Wheel erst beim Deploy auf.
          python-version: "3.14"

      - name: Abhängigkeiten installieren
        # Vollstaendig, damit der Ladetest (test_app_smoke.py) die App
        # gegen die echten Paketversionen prueft - genau das haette den
        # gescheiterten Deploy vorher aufgedeckt.
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Statische Prüfung auf undefinierte Namen
        run: python -m pyflakes streamlit_app.py core_*.py scripts/*.py
